<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadowM" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#maskableBg)" />

  <!-- App Icon Content centered in safe zone (80% circle) -->
  <g filter="url(#dropShadowM)" transform="translate(80, 80) scale(0.6875)">
    <!-- Plate / Bowl Outer Rim -->
    <ellipse cx="256" cy="270" rx="140" ry="85" fill="#ffffff" fill-opacity="0.22" />
    <ellipse cx="256" cy="264" rx="124" ry="74" fill="#ffffff" />
    <ellipse cx="256" cy="264" rx="104" ry="60" fill="#fff7ed" />
    
    <!-- Food elements inside bowl -->
    <path d="M204 260 Q 256 230 308 260 Q 256 280 204 260 Z" fill="#ea580c" fill-opacity="0.85" />
    <circle cx="234" cy="255" r="14" fill="#16a34a" />
    <circle cx="274" cy="258" r="12" fill="#eab308" />
    <circle cx="254" cy="266" r="10" fill="#dc2626" />

    <!-- Fork (Left) -->
    <g transform="translate(120, 140)">
      <path d="M12 0 L12 40 C12 54 28 54 28 40 L28 0 M17 0 L17 38 M23 0 L23 38 M20 52 L20 120" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Spoon (Right) -->
    <g transform="translate(350, 140)">
      <ellipse cx="20" cy="28" rx="16" ry="24" fill="#ffffff" />
      <path d="M20 50 L20 120" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
    </g>

    <!-- Fresh Leaf / Nutrition Accent Top Center -->
    <g transform="translate(256, 160)">
      <path d="M0 0 C25 -25 45 -10 40 20 C20 25 5 15 0 0 Z" fill="#22c55e" />
      <path d="M0 0 C-25 -25 -45 -10 -40 20 C-20 25 -5 15 0 0 Z" fill="#16a34a" />
      <path d="M0 20 L0 32" stroke="#15803d" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
